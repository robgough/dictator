name: Dictator
options:
  bundleIdPrefix: net.robgough
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  schemePathPrefix: ""

schemes:
  Dictator:
    build:
      targets:
        Dictator: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  DictatorIOS:
    build:
      targets:
        DictatorIOS: all
        DictatorIOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DictatorIOSUITests
    archive:
      config: Release

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    minVersion: 0.18.0
    maxVersion: 0.19.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
  # Pinned to the last commit that uses swift-transformers 1.1.x, so it
  # resolves alongside WhisperKit 0.18 (which caps swift-transformers at <1.2).
  MLXSwiftExamples:
    url: https://github.com/ml-explore/mlx-swift-examples
    revision: eb76c5b7f0cc335103bbabb0c3e1c37f8ff5d482
  # FluidAudio backs the Parakeet TDT v3 transcription engine — CoreML models
  # that run on the Apple Neural Engine. Zero dep overlap with WhisperKit /
  # MLX, so no version-pinning conflicts.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.14.5
  # Sparkle drives in-app auto-updates. The appcast feed at SUFeedURL is
  # served from GitHub Pages (docs/appcast.xml) and is signed per-release
  # with an EdDSA key — public key in Info.plist, private key only in CI.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Dictator:
    type: application
    platform: macOS
    sources:
      - path: Sources/Dictator
      - path: Sources/DictatorCore
    postBuildScripts:
      - script: |
          # Install a stable copy of the built .app at ~/Applications. macOS TCC
          # keys permissions by signed identity AND launch path; the DerivedData
          # path changes after every Clean Build Folder, so grants for Mic +
          # Accessibility were getting invalidated each rebuild. After this runs,
          # launch ~/Applications/Dictator.app and the grants persist.
          set -e
          mkdir -p "$HOME/Applications"
          DEST="$HOME/Applications/${PRODUCT_NAME}.app"
          rm -rf "$DEST"
          # `ditto` preserves bundle metadata. `cp -R` doesn't.
          ditto "$BUILT_PRODUCTS_DIR/${PRODUCT_NAME}.app" "$DEST"

          # ExtractAppIntentsMetadata is one of the Apple-internal build
          # phases that runs AFTER this script, so on the very first clean
          # build BUILT_PRODUCTS_DIR doesn't yet have Metadata.appintents
          # at the moment we ditto. On every subsequent build the previous
          # build's metadata is still on disk and we forward-copy it — it
          # lags by one build during incremental development. For release
          # archive builds the archive is produced AFTER all phases run,
          # so the shipped .app always contains current metadata. Without
          # this folder, Spotlight / Shortcuts / Siri don't pick up the
          # app's App Intents (NSServices uses Info.plist and is unaffected).
          SRC_INTENTS="$BUILT_PRODUCTS_DIR/${PRODUCT_NAME}.app/Contents/Resources/Metadata.appintents"
          if [ -d "$SRC_INTENTS" ]; then
              rm -rf "$DEST/Contents/Resources/Metadata.appintents"
              ditto "$SRC_INTENTS" "$DEST/Contents/Resources/Metadata.appintents"
          fi

          # This post-build script runs BEFORE the final CodeSign phase, so the
          # ditto'd copy is unsigned. Re-sign it with the same identity Xcode is
          # about to use. EXPANDED_CODE_SIGN_IDENTITY is the resolved cert (a
          # SHA-1) and EXPANDED_CODE_SIGN_IDENTITY_NAME is the human-readable
          # display name — either works with `codesign --sign`. If signing isn't
          # configured (no team), this still copies but stays ad-hoc, in which
          # case TCC permissions can't be made stable anyway.
          IDENT="${EXPANDED_CODE_SIGN_IDENTITY:-${EXPANDED_CODE_SIGN_IDENTITY_NAME:-}}"
          if [ -n "$IDENT" ] && [ "$IDENT" != "-" ]; then
              ENT_FLAG=""
              if [ -n "${CODE_SIGN_ENTITLEMENTS:-}" ] && [ -f "$CODE_SIGN_ENTITLEMENTS" ]; then
                  ENT_FLAG="--entitlements $CODE_SIGN_ENTITLEMENTS"
              fi
              codesign --force --deep --options runtime --sign "$IDENT" $ENT_FLAG "$DEST" 2>&1 \
                  && echo "Installed and signed: $DEST ($IDENT)"
          else
              codesign --force --deep --sign - "$DEST"
              echo "Installed (ad-hoc): $DEST"
          fi
        name: "Install to ~/Applications"
        basedOnDependencyAnalysis: false
    info:
      path: Sources/Dictator/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        CFBundleName: Dictator
        CFBundleDisplayName: Dictator
        # Substituted from the matching build settings below at "Process Info.plist"
        # time. Keeping them as $() refs means the CI workflow's xcodebuild
        # MARKETING_VERSION=... / CURRENT_PROJECT_VERSION=... overrides actually
        # land in the shipped Info.plist — previously the literals here won and
        # every release got stamped as 2026.5.0 build 1, which broke Sparkle's
        # "is this newer?" check (it always was) and meant Settings → About
        # never showed the real version.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Dictator needs microphone access to listen and transcribe your speech."
        NSAudioCaptureUsageDescription: "Dictator captures system audio during meetings to transcribe what's coming out of your speakers — the other side of your call — alongside your microphone. Audio is processed entirely on your Mac."
        NSAppleEventsUsageDescription: "Dictator pastes transcribed text into the focused app, and (if you turn on \"Pause other audio\" in Settings) tells Spotify or Music to pause while you're dictating."
        # Sparkle auto-updates. The appcast lives at the URL below (served by
        # GitHub Pages from docs/appcast.xml). SUPublicEDKey is the EdDSA
        # public key used to verify each release's signature; generate the
        # keypair once with Sparkle's `generate_keys` tool, paste the public
        # half here, and store the private half as the SPARKLE_PRIVATE_KEY
        # GitHub Actions secret. See RELEASING.md.
        SUFeedURL: "https://dictator.robgough.net/appcast.xml"
        SUPublicEDKey: "nKdcgJBzUX/UsPNA71RLRx1CzXBby33QOor7CQ7t9Yg="
        SUEnableAutomaticChecks: true
        # Right-click → Services → "Learn Word in Dictator…" in any app
        # that has text selected. The receiver is LearnWordProvider, wired
        # up via NSApp.servicesProvider in AppDelegate. `NSPortName` must
        # match CFBundleName; `NSMessage` is the selector base (macOS
        # appends `:userData:error:` automatically). pbs caches services
        # by signed identity — after a fresh install the entry may take a
        # rescan to appear; NSUpdateDynamicServices() at launch nudges it.
        NSServices:
          - NSMessage: learnWord
            NSPortName: Dictator
            NSMenuItem:
              default: "Learn Word in Dictator…"
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
            NSReturnTypes: []
        # Custom URL scheme — handles `dictator://settings` (opens the Settings
        # window) and `dictator://onboarding` (re-runs the first-run wizard).
        # Useful as a deep-link target for support docs and scripting; the menu
        # bar is otherwise the only way to reach these surfaces in an accessory
        # app. CFBundleURLName uses reverse-DNS by convention so we don't clash
        # with anyone else who happens to claim "dictator".
        CFBundleURLTypes:
          - CFBundleURLName: net.robgough.Dictator
            CFBundleURLSchemes:
              - dictator
    # Two entitlements files, swapped per build config via CODE_SIGN_ENTITLEMENTS
    # below. The only difference is `get-task-allow`:
    #   - Debug  → true  (lets Xcode's debugger attach)
    #   - Release → false (notarization rejects binaries with it set)
    # Both files are checked in and owned manually — no `entitlements:` block
    # here, because xcodegen would regenerate a single file and clobber one of
    # them on every `./gen`.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.robgough.Dictator
        # Default values for local builds. The CI release workflow overrides
        # both via `xcodebuild MARKETING_VERSION=... CURRENT_PROJECT_VERSION=...`
        # — the marketing version comes from the v* tag and the build number is
        # the GitHub Actions run number (monotonically increasing). Bumping the
        # default here just keeps `Settings → About` honest when developing
        # against an unreleased build locally.
        MARKETING_VERSION: "2026.5.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ENABLE_HARDENED_RUNTIME: YES
        # macOS TCC keys Mic / Accessibility grants by *signed identity*, so an
        # unstable signature (ad-hoc) makes the OS forget you every rebuild.
        # Three env vars together pin the signature to your Apple Development
        # cert:
        #   - DICTATOR_TEAM_ID            : your Apple Personal Team ID
        #   - DICTATOR_CODE_SIGN_IDENTITY : the SHA-1 of your installed cert
        #                                   (`security find-identity -v -p codesigning`)
        #   - DICTATOR_CODE_SIGN_STYLE    : "Manual" — automatic style requires
        #                                   GUI provisioning from Xcode which
        #                                   doesn't play well with CLI builds.
        # When ANY of the three are unset, you get ad-hoc signing — works for a
        # one-off build, but TCC will revoke grants on every rebuild because
        # the ad-hoc signature changes. Bake all three into your shell profile
        # (e.g. ~/.zprofile) for stable grants. See README → "Build" for details.
        DEVELOPMENT_TEAM: ${DICTATOR_TEAM_ID}
        CODE_SIGN_IDENTITY: ${DICTATOR_CODE_SIGN_IDENTITY}
        CODE_SIGN_STYLE: ${DICTATOR_CODE_SIGN_STYLE}
        # Manual signing needs an explicit (possibly empty) profile specifier
        # so xcodebuild doesn't try to fetch a provisioning profile. Sandbox is
        # disabled in our entitlements, so no profile is required.
        PROVISIONING_PROFILE_SPECIFIER: ""
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The "Install to ~/Applications" post-build phase needs to read
        # BUILT_PRODUCTS_DIR and write to ~/Applications. Xcode 15+ sandboxes
        # script phases by default, which denies both. Opt out for this target.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/Dictator/Dictator.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/Dictator/Dictator.entitlements
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: MLXSwiftExamples
        product: MLXLLM
      - package: MLXSwiftExamples
        product: MLXLMCommon
      - package: FluidAudio
        product: FluidAudio
      - package: Sparkle
        product: Sparkle

  # iOS prototype. Currently a bare SwiftUI skeleton — recording, Parakeet,
  # vocab substitution, and the press-to-talk UI land in subsequent phases.
  # No code sharing with the macOS target yet; Sources/DictatorCore moves
  # over in Phase 1 once we know the skeleton actually builds and runs.
  DictatorIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/DictatorIOS
      - path: Sources/DictatorCore
    info:
      path: Sources/DictatorIOS/Info.plist
      properties:
        CFBundleName: Dictator
        CFBundleDisplayName: Dictator
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Dictator transcribes your voice on-device to turn speech into text, whether you dictate in the app or from the Dictator keyboard."
        # Dictator only uses encryption via the standard HTTPS stack
        # (the one-time Hugging Face model download). That qualifies
        # for the App Store's exempt-encryption category, and setting
        # this flag to false lets the build skip the Export Compliance
        # prompt App Store Connect shows on every fresh upload. The
        # self-declaration is what Apple wants for apps that use only
        # iOS-provided crypto; no additional paperwork is needed.
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchGlyph
          UIImageRespectsSafeAreaInsets: false
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Deliberately NO `audio` UIBackgroundMode. Dictation records
        # only while Dictator is foregrounded; the moment the app
        # backgrounds we stop and transcribe whatever we've captured
        # so far (see RecordingViewModel.handleEnteredBackground)
        # rather than keeping the mic live. App Review rejects the
        # `audio` mode under guideline 2.5.4 for apps that aren't
        # background *playback* (music / streaming) — the documented
        # background-recording use isn't enough to satisfy a reviewer,
        # and it cost us a submission. Don't re-add it without a
        # deliberate App Review plan (a screen recording of the
        # background capture attached to the App Review notes).
        # Custom URL scheme — the Dictator keyboard extension calls
        # `dictator://keyboard?mode=record` or `mode=assist` to wake
        # the host app, which then records / transforms and stages
        # the result in the shared App Group container for the
        # keyboard to read on return.
        CFBundleURLTypes:
          - CFBundleURLName: net.robgough.DictatorIOS
            CFBundleURLSchemes:
              - dictator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.robgough.DictatorIOS
        # iOS is NOT built by the release workflow (that's macOS/Sparkle
        # only) — the app + keyboard are archived and uploaded to App
        # Store Connect by hand, so these literals are what actually
        # ship. Bump CURRENT_PROJECT_VERSION on every upload: App Store
        # Connect rejects a duplicate build number under the same
        # MARKETING_VERSION. Keep this in lockstep with the keyboard
        # extension's value below — App Store validation rejects an
        # extension whose version/build doesn't match its host app.
        MARKETING_VERSION: "2026.5.2"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Team ID drives signing on real devices and App Store builds.
        # Read from `${DICTATOR_IOS_TEAM_ID}` so the value stays out of
        # the repo (the .env file is gitignored). Falls back to empty
        # for Simulator-only builds — no signing required, no
        # provisioning profile fetch, no Issues-navigator noise.
        #
        # A separate env var from the macOS `${DICTATOR_TEAM_ID}` so
        # devs running both can use one team for both (set both vars
        # to the same value) or split across teams if their Developer
        # ID cert lives elsewhere from their iOS provisioning rights.
        DEVELOPMENT_TEAM: ${DICTATOR_IOS_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
        # Asset catalog names — Xcode picks up the matching asset
        # catalog entries at build time. The 1024×1024 source in
        # AppIcon.appiconset is enough for iOS to derive every
        # required size; AccentColor mirrors the macOS tint so the
        # iOS UI uses the same purple-ish accent.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/DictatorIOS/DictatorIOS.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/DictatorIOS/DictatorIOS.entitlements
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      # Embed the keyboard extension into the host .app so installing
      # the host installs the keyboard. The user still has to enable
      # it via Settings → General → Keyboard → Keyboards → Add New,
      # but the keyboard binary ships inside the app bundle.
      - target: DictatorKeyboard

  # UI test target — primarily used to drive App Store screenshot
  # capture across simulator sizes. See scripts/take-screenshots.sh.
  DictatorIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Sources/DictatorIOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.robgough.DictatorIOSUITests
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ${DICTATOR_IOS_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: DictatorIOS
    dependencies:
      - target: DictatorIOS

  # Custom keyboard extension. Renders two large hold-to-talk buttons
  # (mic + assist) that launch the host app via custom URL scheme;
  # the host records / transforms and stages the result in the App
  # Group container for the keyboard to insert when the user returns
  # to the original text field. Keyboards CAN'T access the mic
  # directly — Apple-enforced — hence the host-app dance.
  DictatorKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/DictatorKeyboard
      # Shared shuttle between keyboard + host. Both processes need
      # the same Codable shapes — the file lives under the iOS
      # target's sources to keep everything in one place, and the
      # keyboard target pulls it in by explicit path.
      - path: Sources/DictatorIOS/KeyboardBridge.swift
    info:
      path: Sources/DictatorKeyboard/Info.plist
      properties:
        CFBundleName: DictatorKeyboard
        CFBundleDisplayName: Dictator
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Required so the keyboard can read the App Group shared
            # container and launch the host app via URL scheme.
            # The user has to toggle this in Settings → General →
            # Keyboard → Keyboards → Dictator → Allow Full Access.
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.robgough.DictatorIOS.Keyboard
        # Must match the host app (DictatorIOS) version + build exactly.
        MARKETING_VERSION: "2026.5.2"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Must match the host app's team — extensions are signed
        # alongside the parent .app. See the host-app comment above.
        DEVELOPMENT_TEAM: ${DICTATOR_IOS_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/DictatorKeyboard/DictatorKeyboard.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/DictatorKeyboard/DictatorKeyboard.entitlements
