name: Dictator
options:
  bundleIdPrefix: net.robgough
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  schemePathPrefix: ""

schemes:
  Dictator:
    build:
      targets:
        Dictator: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    minVersion: 0.18.0
    maxVersion: 0.19.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
  # Pinned to the last commit that uses swift-transformers 1.1.x, so it
  # resolves alongside WhisperKit 0.18 (which caps swift-transformers at <1.2).
  MLXSwiftExamples:
    url: https://github.com/ml-explore/mlx-swift-examples
    revision: eb76c5b7f0cc335103bbabb0c3e1c37f8ff5d482
  # FluidAudio backs the Parakeet TDT v3 transcription engine — CoreML models
  # that run on the Apple Neural Engine. Zero dep overlap with WhisperKit /
  # MLX, so no version-pinning conflicts.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    from: 0.14.5
  # Sparkle drives in-app auto-updates. The appcast feed at SUFeedURL is
  # served from GitHub Pages (docs/appcast.xml) and is signed per-release
  # with an EdDSA key — public key in Info.plist, private key only in CI.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Dictator:
    type: application
    platform: macOS
    sources:
      - path: Sources/Dictator
    postBuildScripts:
      - script: |
          # Install a stable copy of the built .app at ~/Applications. macOS TCC
          # keys permissions by signed identity AND launch path; the DerivedData
          # path changes after every Clean Build Folder, so grants for Mic +
          # Accessibility were getting invalidated each rebuild. After this runs,
          # launch ~/Applications/Dictator.app and the grants persist.
          set -e
          mkdir -p "$HOME/Applications"
          DEST="$HOME/Applications/${PRODUCT_NAME}.app"
          rm -rf "$DEST"
          # `ditto` preserves bundle metadata. `cp -R` doesn't.
          ditto "$BUILT_PRODUCTS_DIR/${PRODUCT_NAME}.app" "$DEST"

          # ExtractAppIntentsMetadata is one of the Apple-internal build
          # phases that runs AFTER this script, so on the very first clean
          # build BUILT_PRODUCTS_DIR doesn't yet have Metadata.appintents
          # at the moment we ditto. On every subsequent build the previous
          # build's metadata is still on disk and we forward-copy it — it
          # lags by one build during incremental development. For release
          # archive builds the archive is produced AFTER all phases run,
          # so the shipped .app always contains current metadata. Without
          # this folder, Spotlight / Shortcuts / Siri don't pick up the
          # app's App Intents (NSServices uses Info.plist and is unaffected).
          SRC_INTENTS="$BUILT_PRODUCTS_DIR/${PRODUCT_NAME}.app/Contents/Resources/Metadata.appintents"
          if [ -d "$SRC_INTENTS" ]; then
              rm -rf "$DEST/Contents/Resources/Metadata.appintents"
              ditto "$SRC_INTENTS" "$DEST/Contents/Resources/Metadata.appintents"
          fi

          # This post-build script runs BEFORE the final CodeSign phase, so the
          # ditto'd copy is unsigned. Re-sign it with the same identity Xcode is
          # about to use. EXPANDED_CODE_SIGN_IDENTITY is the resolved cert (a
          # SHA-1) and EXPANDED_CODE_SIGN_IDENTITY_NAME is the human-readable
          # display name — either works with `codesign --sign`. If signing isn't
          # configured (no team), this still copies but stays ad-hoc, in which
          # case TCC permissions can't be made stable anyway.
          IDENT="${EXPANDED_CODE_SIGN_IDENTITY:-${EXPANDED_CODE_SIGN_IDENTITY_NAME:-}}"
          if [ -n "$IDENT" ] && [ "$IDENT" != "-" ]; then
              ENT_FLAG=""
              if [ -n "${CODE_SIGN_ENTITLEMENTS:-}" ] && [ -f "$CODE_SIGN_ENTITLEMENTS" ]; then
                  ENT_FLAG="--entitlements $CODE_SIGN_ENTITLEMENTS"
              fi
              codesign --force --deep --options runtime --sign "$IDENT" $ENT_FLAG "$DEST" 2>&1 \
                  && echo "Installed and signed: $DEST ($IDENT)"
          else
              codesign --force --deep --sign - "$DEST"
              echo "Installed (ad-hoc): $DEST"
          fi
        name: "Install to ~/Applications"
        basedOnDependencyAnalysis: false
    info:
      path: Sources/Dictator/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        CFBundleName: Dictator
        CFBundleDisplayName: Dictator
        # Substituted from the matching build settings below at "Process Info.plist"
        # time. Keeping them as $() refs means the CI workflow's xcodebuild
        # MARKETING_VERSION=... / CURRENT_PROJECT_VERSION=... overrides actually
        # land in the shipped Info.plist — previously the literals here won and
        # every release got stamped as 2026.5.0 build 1, which broke Sparkle's
        # "is this newer?" check (it always was) and meant Settings → About
        # never showed the real version.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Dictator needs microphone access to listen and transcribe your speech."
        NSAppleEventsUsageDescription: "Dictator pastes transcribed text into the focused app."
        # Sparkle auto-updates. The appcast lives at the URL below (served by
        # GitHub Pages from docs/appcast.xml). SUPublicEDKey is the EdDSA
        # public key used to verify each release's signature; generate the
        # keypair once with Sparkle's `generate_keys` tool, paste the public
        # half here, and store the private half as the SPARKLE_PRIVATE_KEY
        # GitHub Actions secret. See RELEASING.md.
        SUFeedURL: "https://dictator.robgough.net/appcast.xml"
        SUPublicEDKey: "nKdcgJBzUX/UsPNA71RLRx1CzXBby33QOor7CQ7t9Yg="
        SUEnableAutomaticChecks: true
        # Right-click → Services → "Learn Word in Dictator…" in any app
        # that has text selected. The receiver is LearnWordProvider, wired
        # up via NSApp.servicesProvider in AppDelegate. `NSPortName` must
        # match CFBundleName; `NSMessage` is the selector base (macOS
        # appends `:userData:error:` automatically). pbs caches services
        # by signed identity — after a fresh install the entry may take a
        # rescan to appear; NSUpdateDynamicServices() at launch nudges it.
        NSServices:
          - NSMessage: learnWord
            NSPortName: Dictator
            NSMenuItem:
              default: "Learn Word in Dictator…"
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
            NSReturnTypes: []
    # Two entitlements files, swapped per build config via CODE_SIGN_ENTITLEMENTS
    # below. The only difference is `get-task-allow`:
    #   - Debug  → true  (lets Xcode's debugger attach)
    #   - Release → false (notarization rejects binaries with it set)
    # Both files are checked in and owned manually — no `entitlements:` block
    # here, because xcodegen would regenerate a single file and clobber one of
    # them on every `./gen`.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.robgough.Dictator
        # Default values for local builds. The CI release workflow overrides
        # both via `xcodebuild MARKETING_VERSION=... CURRENT_PROJECT_VERSION=...`
        # — the marketing version comes from the v* tag and the build number is
        # the GitHub Actions run number (monotonically increasing). Bumping the
        # default here just keeps `Settings → About` honest when developing
        # against an unreleased build locally.
        MARKETING_VERSION: "2026.5.2"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_HARDENED_RUNTIME: YES
        # macOS TCC keys Mic / Accessibility grants by *signed identity*, so an
        # unstable signature (ad-hoc) makes the OS forget you every rebuild.
        # Three env vars together pin the signature to your Apple Development
        # cert:
        #   - DICTATOR_TEAM_ID            : your Apple Personal Team ID
        #   - DICTATOR_CODE_SIGN_IDENTITY : the SHA-1 of your installed cert
        #                                   (`security find-identity -v -p codesigning`)
        #   - DICTATOR_CODE_SIGN_STYLE    : "Manual" — automatic style requires
        #                                   GUI provisioning from Xcode which
        #                                   doesn't play well with CLI builds.
        # When ANY of the three are unset, you get ad-hoc signing — works for a
        # one-off build, but TCC will revoke grants on every rebuild because
        # the ad-hoc signature changes. Bake all three into your shell profile
        # (e.g. ~/.zprofile) for stable grants. See README → "Build" for details.
        DEVELOPMENT_TEAM: ${DICTATOR_TEAM_ID}
        CODE_SIGN_IDENTITY: ${DICTATOR_CODE_SIGN_IDENTITY}
        CODE_SIGN_STYLE: ${DICTATOR_CODE_SIGN_STYLE}
        # Manual signing needs an explicit (possibly empty) profile specifier
        # so xcodebuild doesn't try to fetch a provisioning profile. Sandbox is
        # disabled in our entitlements, so no profile is required.
        PROVISIONING_PROFILE_SPECIFIER: ""
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The "Install to ~/Applications" post-build phase needs to read
        # BUILT_PRODUCTS_DIR and write to ~/Applications. Xcode 15+ sandboxes
        # script phases by default, which denies both. Opt out for this target.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/Dictator/Dictator.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/Dictator/Dictator.entitlements
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: MLXSwiftExamples
        product: MLXLLM
      - package: MLXSwiftExamples
        product: MLXLMCommon
      - package: FluidAudio
        product: FluidAudio
      - package: Sparkle
        product: Sparkle
